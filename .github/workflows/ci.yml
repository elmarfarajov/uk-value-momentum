name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.8"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Strict typing
        run: |
          pip install -e ".[dev]"
          mypy

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests (synthetic data in each source's format)
        run: pytest -q --cov --cov-report=term-missing
      - name: Validation suite (data checks SKIP without the licensed files)
        run: |
          mkdir -p /tmp/empty
          UKF_DATA=/tmp/empty ukf validate --fast

  package:
    # the wheel on its own, without the development extras
    needs: lint
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel alone and run it
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install dist/*.whl
          cd /tmp
          mkdir -p empty
          UKF_DATA=/tmp/empty /tmp/wheel/bin/ukf validate --fast
          UKF_DATA=/tmp/empty /tmp/wheel/bin/ukf data list
          /tmp/wheel/bin/python -c "import pathlib, ukfactors; assert (pathlib.Path(ukfactors.__file__).parent / 'py.typed').exists()"
