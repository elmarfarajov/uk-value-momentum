[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ukfactors"
version = "0.1.0"
description = "Value and momentum in the UK stock market, 1972-2026: factors, crashes, costs, short sellers and the stamp-duty natural experiment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elmar Farajov" }]
keywords = ["momentum", "value investing", "factor investing", "UK stock market", "asset pricing", "empirical finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Science/Research",
    "Typing :: Typed",
]
dependencies = ["numpy>=2.0", "scipy>=1.13", "pandas>=2.2.2", "matplotlib>=3.9", "openpyxl>=3.1", "requests>=2.31", "yfinance>=0.2.54", "lxml>=5.0"]

[project.urls]
Repository = "https://github.com/elmarfarajov/uk-value-momentum"
Changelog = "https://github.com/elmarfarajov/uk-value-momentum/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.16.8", "mypy>=1.10", "hypothesis>=6.100", "statsmodels>=0.14", "pandas-stubs", "types-requests", "build>=1.2", "twine>=5.0"]

[project.scripts]
ukf = "ukfactors.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ukfactors = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# chart captions are prose; breaking them mid-sentence hurts more than it helps
"src/ukfactors/gallery/foundation.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
# pandas-stubs types most frame and series methods as returning Any
warn_return_any = false
files = ["src/ukfactors"]

[[tool.mypy.overrides]]
module = ["scipy.*", "statsmodels.*", "yfinance.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# the gallery draws with pandas and matplotlib objects whose stubs are looser than the code
module = ["ukfactors.gallery.foundation"]
disallow_any_generics = false

[tool.coverage.run]
source = ["ukfactors"]
omit = ["*/__main__.py"]
